[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "niwoec"
version = "3.0.0"
description = "Deterministic offline verification of source code against an FRS"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "niwoec contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["build", "mypy", "pytest", "pytest-cov", "ruff"]
treesitter = ["tree-sitter>=0.20"]

[project.scripts]
niwoec = "niwoec.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/niwoec"]

[tool.hatch.build.targets.wheel.force-include]
"examples" = "examples"

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
